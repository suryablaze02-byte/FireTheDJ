name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew testPhoneDebugUnitTest assemblePhoneDebug assembleTvDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FireTheDJ-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
